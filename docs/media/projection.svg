<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Proyección de una posición sobre la ruta</title>
  <desc id="desc">Una ruta con tres vértices A, B y C. La posición P del bus se proyecta en ángulo recto sobre el tramo A-B en el punto P'. La fracción t indica dónde cae P' dentro del tramo. La distancia recorrida es la distancia acumulada hasta A más t por el largo del tramo. La distancia a la ruta es el largo de la perpendicular de P a P'. Si supera 150 metros, el bus está fuera de ruta.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3A3E45"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#174A94"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A5000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="560" rx="16" fill="#FFFFFF"/>

  <text x="40" y="48" font-size="24" font-weight="700" fill="#1B1D21">Proyección de una posición sobre la ruta</text>
  <text x="40" y="72" font-size="14" fill="#5B5F66">RoutePath.Project: de una sola proyección salen la distancia recorrida (próxima parada) y la distancia a la ruta (fuera de ruta)</text>

  <!-- Off-route band (150 m each side of segment A-B), illustrative -->
  <path d="M120 300 L560 220 L560 340 L120 420 Z" fill="#EDF3FC"/>
  <text x="330" y="414" font-size="12" fill="#174A94" transform="rotate(-10.3 330 414)">franja de 150 m a cada lado: dentro de ruta</text>

  <!-- Route -->
  <polyline points="140,360 540,287 760,360" fill="none" stroke="#1F5FBF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vertices -->
  <circle cx="140" cy="360" r="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="3"/>
  <text x="128" y="392" font-size="16" font-weight="700" fill="#1B1D21">A</text>
  <text x="104" y="410" font-size="12" fill="#5B5F66">acumulado 0 m</text>
  <circle cx="540" cy="287" r="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="3"/>
  <text x="533" y="272" font-size="16" font-weight="700" fill="#1B1D21">B</text>
  <text x="506" y="255" font-size="12" fill="#5B5F66">acumulado 420 m</text>
  <circle cx="760" cy="360" r="9" fill="#FFFFFF" stroke="#1F5FBF" stroke-width="3"/>
  <text x="754" y="392" font-size="16" font-weight="700" fill="#1B1D21">C</text>
  <text x="712" y="410" font-size="12" fill="#5B5F66">acumulado 650 m</text>

  <!-- Stop on segment B-C -->
  <rect x="640" y="318" width="16" height="16" rx="3" fill="#1F5FBF" transform="rotate(18 648 326)"/>
  <text x="600" y="358" font-size="13" font-weight="700" fill="#174A94">Parada</text>
  <text x="600" y="374" font-size="12" fill="#5B5F66">a 540 m del inicio</text>

  <!-- Bus position P and its projection P' on A-B -->
  <circle cx="360" cy="230" r="13" fill="#F2A900" stroke="#1B1D21" stroke-width="2.5"/>
  <text x="381" y="222" font-size="16" font-weight="700" fill="#1B1D21">P</text>
  <text x="381" y="240" font-size="12" fill="#5B5F66">posición del GPS</text>

  <!-- P' = foot of perpendicular from P(360,230) to line A(140,360)-B(540,287) -->
  <line x1="360" y1="230" x2="371.8" y2="317.7" stroke="#8A5000" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
  <circle cx="371.8" cy="317.7" r="6" fill="#1B1D21"/>
  <text x="380" y="336" font-size="16" font-weight="700" fill="#1B1D21">P'</text>
  <!-- Right-angle mark -->
  <path d="M362.5 319.5 L360.8 309.6 L370.6 307.8" fill="none" stroke="#8A5000" stroke-width="1.5"/>
  <text x="346" y="262" font-size="13" font-weight="700" fill="#8A5000" text-anchor="end">d = distancia a la ruta</text>
  <text x="346" y="279" font-size="12" fill="#8A5000" text-anchor="end">(perpendicular |P − P'|)</text>

  <!-- t along A-B -->
  <path d="M146 384 L372 343" fill="none" stroke="#174A94" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="226" y="394" font-size="13" font-weight="700" fill="#174A94" transform="rotate(-10.3 226 394)">t · |AB|</text>

  <!-- ===== Right column: the steps ===== -->
  <rect x="820" y="100" width="250" height="420" rx="14" fill="#F6F7F5" stroke="#E6E8EC"/>
  <text x="840" y="132" font-size="15" font-weight="700" fill="#1B1D21">Para cada tramo A→B</text>
  <g font-size="13" fill="#3A3E45">
    <text x="840" y="162">1. Pasar A, B y P a metros</text>
    <text x="856" y="180" fill="#5B5F66">(plano local, equirectangular)</text>
    <text x="840" y="210">2. t = (AP · AB) / |AB|²</text>
    <text x="856" y="228" fill="#5B5F66">limitado entre 0 y 1</text>
    <text x="840" y="258">3. P' = A + t · AB</text>
    <text x="840" y="288">4. d = |P − P'|</text>
    <text x="840" y="318">5. Quedarse con el tramo</text>
    <text x="856" y="336">de menor d</text>
  </g>
  <line x1="840" y1="356" x2="1050" y2="356" stroke="#D5D8DD"/>
  <text x="840" y="382" font-size="14" font-weight="700" fill="#1B1D21">Resultado</text>
  <g font-size="13" fill="#3A3E45">
    <text x="840" y="408">Recorrido = acumulado(A)</text>
    <text x="856" y="426">+ t · largo del tramo</text>
    <text x="840" y="452">Fuera de ruta si d &gt; 150 m</text>
    <text x="840" y="478">Próxima parada: la primera</text>
    <text x="856" y="496">con distancia ≥ recorrido</text>
  </g>

  <text x="40" y="530" font-size="12" fill="#5B5F66">Ilustrativo: las distancias no están a escala. En el ejemplo, P' está a ~117 m de A, así que la próxima parada es la que está a 540 m.</text>
</svg>
