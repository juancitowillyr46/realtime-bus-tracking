name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BusTracking.slnx

      - name: Build
        run: dotnet build BusTracking.slnx --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format BusTracking.slnx --no-restore --verify-no-changes

      # Integration tests start RabbitMQ with Testcontainers (Docker is available on ubuntu runners).
      - name: Test
        run: dotnet test BusTracking.slnx --no-build --configuration Release

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 58 needs Node 22.13 or later; 24 is the current LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
